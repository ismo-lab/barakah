# F-Droid build metadata for Barakah (app ID dev.barakah.app).
#
# This is a working copy of the file that belongs in the fdroiddata repository at
# metadata/dev.barakah.app.yml. It lives here so the build recipe is reviewed next to the
# build it describes; the merge request to https://gitlab.com/fdroid/fdroiddata carries a
# copy of it.
#
# Updating for a release:
#   1. Bump BUILD_NUMBER, VERSION_CODE and VERSION_NAME in app/version.properties and commit.
#   2. Tag that commit v<VERSION_NAME> (e.g. v1.0.0.1344). CI fails if the tag and the file
#      disagree, and only a tag publishes a GitHub release.
#   3. Copy the tag's versionCode/versionName here, point commit at the tag, and bump
#      CurrentVersion/CurrentVersionCode.
#
# The versionCode is NOT passed in from here on purpose. fdroidserver never evaluates
# build.gradle.kts, so anything it needs has to be reproducible from the commit alone: the
# number in app/version.properties is the source of truth, and a rebuild of the same tag gets
# the same code. Only set barakahVersionCode in gradleprops if a tag genuinely needs a number
# the file does not carry.

Categories:
  - Religion
License: GPL-3.0-only
# The English Tafsir al-Jalalayn translation is redistributed under the publisher's terms, which
# are not a free licence. The code is GPL-3.0 and the assets are committed and built from source.
AntiFeatures:
  - NonFreeAssets
AuthorName: ismo-lab
WebSite: https://github.com/ismo-lab/barakah
SourceCode: https://github.com/ismo-lab/barakah
IssueTracker: https://github.com/ismo-lab/barakah/issues

RepoType: git
Repo: https://github.com/ismo-lab/barakah.git

Builds:
  - versionName: REPLACE_WITH_VERSION_NAME
    versionCode: REPLACE_WITH_VERSION_CODE
    # A tag is accepted here and is preferable to a commit id: it states which release was built
    # and makes the version.properties numbers checkable against it.
    commit: REPLACE_WITH_TAG
    subdir: app
    # This list is Gradle flavors, not tasks. fdroidserver appends "Release" and runs
    # assembleRelease itself; naming the task here would ask for assembleAssembleReleaseRelease.
    gradle:
      - yes
    gradleprops:
      # fdroidserver signs the APK with its own key, so the build must not try to sign it with
      # this project's keystore (or generate a throwaway one first).
      - signingDisabled
    # The offline city catalog, the Quran, the tafsir, the supplications and the adhan
    # recordings are all committed, so the build needs no network beyond Maven and the
    # Android SDK.
    #
    # compileSdk is 37 (see app/build.gradle.kts). There is no metadata key that installs an SDK
    # platform ("sdks:" is not a build flag — fdroidserver warns and drops it), so the buildserver
    # image has to carry platforms;android-37, or AGP has to be allowed to download it. That is the
    # one question to ask the maintainers before this lands. The Gradle version is not pinned
    # here either: gradlew-fdroid reads gradle/wrapper/gradle-wrapper.properties and fetches what
    # the project asks for.

# Tags are cut by hand (see the header), so nothing here should generate a build entry on its
# own. UpdateCheckMode: Tags / AutoUpdateMode: Version can be enabled once the first release is
# accepted, since the tag name then carries the version.
AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: REPLACE_WITH_VERSION_NAME
CurrentVersionCode: REPLACE_WITH_VERSION_CODE
