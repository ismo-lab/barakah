# F-Droid build metadata for Barakah (app ID dev.barakah.app).
#
# This is a working copy of the file that belongs in the fdroiddata repository at
# metadata/dev.barakah.app.yml. It lives here so the build recipe is reviewed next to the
# build it describes; the merge request to https://gitlab.com/fdroid/fdroiddata carries a
# copy of it.
#
# Updating for a release: CI publishes each push to main as 1.0.0.<run number> with
# versionCode 101006 + <run number>, so both numbers must be repeated in the build block and
# passed to Gradle, because fdroidserver never evaluates build.gradle.kts. Fill in commit,
# versionName, versionCode, gradleprops and CurrentVersion/CurrentVersionCode from the
# GitHub release, then bump the block for every release.

Categories:
  - Religion
License: GPL-3.0-only
AuthorName: ismo-lab
WebSite: https://github.com/ismo-lab/barakah
SourceCode: https://github.com/ismo-lab/barakah
IssueTracker: https://github.com/ismo-lab/barakah/issues

RepoType: git
Repo: https://github.com/ismo-lab/barakah.git

Builds:
  - versionName: 1.0.0.REPLACE_WITH_RUN
    versionCode: 101006
    commit: REPLACE_WITH_TAGGED_COMMIT_SHA
    subdir: app
    gradle:
      - assembleRelease
    gradleprops:
      - barakahVersionCode=101006
      - barakahVersionName=1.0.0.REPLACE_WITH_RUN
    # The offline city catalog, the Quran, the tafsir, the supplications and the adhan
    # recordings are all committed, so the build needs no network beyond Maven and the
    # Android SDK. The keystore this project signs with is generated by the
    # prepareSigningKeystore task when app/keystore.jks is missing; F-Droid re-signs the APK
    # with its own key afterwards.
    #
    # compileSdk is plain 36 (no minor API level), so the default buildserver image only
    # needs platforms;android-36 and build-tools 36.x.
    sdks:
      - platforms;android-36

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0.REPLACE_WITH_RUN
CurrentVersionCode: 101006
