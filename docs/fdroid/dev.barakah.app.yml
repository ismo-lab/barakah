# F-Droid build metadata for Barakah (app ID dev.barakah.app).
#
# This is a snapshot of the file that lives in fdroiddata at metadata/dev.barakah.app.yml,
# kept here so the recipe is reviewed next to the build it describes. fdroiddata is the copy
# that counts: F-Droid's autoupdate rewrites versionName/versionCode there on every tagged
# release, so expect the numbers below to lag behind. Refresh this file by hand when the
# recipe itself changes, not for every release.
#
# Updating for a release:
#   1. Bump BUILD_NUMBER, VERSION_CODE and VERSION_NAME in app/version.properties and commit.
#   2. Tag that commit v<VERSION_NAME> (e.g. v1.0.0.1344). CI fails if the tag and the file
#      disagree, and only a tag publishes a GitHub release.
#   3. Point commit at the tag and bump CurrentVersion/CurrentVersionCode.
#
# The versionCode is not passed in from here on purpose. fdroidserver never evaluates
# build.gradle.kts, so anything it needs has to be reproducible from the commit alone: the
# number in app/version.properties is the source of truth, and a rebuild of the same tag gets
# the same code. UpdateCheckData reads that file inside each tag for the same reason.
#
# compileSdk is 37 (see app/build.gradle.kts). There is no metadata key that installs an SDK
# platform: the buildserver ships only SDK tools, and AGP downloads what the build asks for.
# A build of v1.0.0.1343 confirmed it installs "Android SDK Platform 37.0" itself.
#
# The APK carries no dependency metadata block (android.dependenciesInfo in build.gradle.kts):
# F-Droid's scanner rejects that signing block, and nothing reads it outside Google Play.

AntiFeatures:
  NonFreeAssets:
    en-US: The English Tafsir al-Jalalayn translation is redistributed under the publisher's
      terms, which are not a free licence; the Tanzil translations are licensed for
      non-commercial use only.
Categories:
  - Religion
License: GPL-3.0-only
AuthorName: ismo-lab
WebSite: https://github.com/ismo-lab/barakah
SourceCode: https://github.com/ismo-lab/barakah
IssueTracker: https://github.com/ismo-lab/barakah/issues

RepoType: git
Repo: https://github.com/ismo-lab/barakah.git
Binaries: https://github.com/ismo-lab/barakah/releases/download/v%v/Barakah-v%v.apk

Builds:
  - versionName: 1.0.0.1344
    versionCode: 101344
    commit: 49f1772fa9baecab0e76b5c990ea4644e4b094fe
    subdir: app
    # This list is Gradle flavors, not tasks. fdroidserver appends "Release" and runs
    # assembleRelease itself; naming the task here would ask for assembleAssembleReleaseRelease.
    gradle:
      - yes
    gradleprops:
      # fdroidserver re-signs the APK with the key in AllowedAPKSigningKeys, so the build must
      # not try to sign with this project's keystore (or generate a throwaway one first).
      - signingDisabled

AllowedAPKSigningKeys: c506110a0f08c720f1d19ef8b3db765f9805d3b6c568e7cb5d45ce0756a89cec

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckName: v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+
UpdateCheckData: app/version.properties|VERSION_CODE=(\d+)|.|VERSION_NAME=([0-9.]+)
CurrentVersion: 1.0.0.1344
CurrentVersionCode: 101344
