#Updated for update compatibility
# The build derives both numbers from MAJOR/MINOR/PATCH/BUILD_NUMBER; the VERSION_* lines are
# written by the increment* tasks and read by CI, which fails if the four disagree.
# BUILD_NUMBER must increase for every published release and must never be reset when MINOR or
# PATCH moves: versionCode is MAJOR*100000 + MINOR*10000 + PATCH*100 + BUILD_NUMBER, so resetting it
# can produce a code lower than one already published, and both F-Droid and Android refuse that.
BUILD_NUMBER=1346
MAJOR=1
MINOR=0
PATCH=0
VERSION_CODE=101346
VERSION_NAME=1.0.0.1346
