name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Get Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep VERSION_NAME app/version.properties | cut -d'=' -f2 | tr -d '\r')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "Extracted App Version: $VERSION_NAME"

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
        echo "Renamed app-debug.apk to Barakah-v${{ env.VERSION_NAME }}.apk"

    - name: Delete old releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --json tagName -q ".[].tagName" | while read -r tag; do
          gh release delete "$tag" --cleanup-tag -y || true
        done

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: "v${{ env.VERSION_NAME }}"
        name: "Barakah v${{ env.VERSION_NAME }}"
        body: |
          ## 📝 Changelog - v${{ env.VERSION_NAME }}

          ### ✨ Core Improvements
          - **🔒 Privacy Reinforcement**: Removed all update checking mechanisms to operate completely offline, guaranteeing 100% telemetry-free local execution.
          - **🌸 Brand Refinement**: Adjusted the sacred typography naming representation to **`بَرَكَة`** (Barakah) across the interface and documentation.
          - **🛠️ ASCII cleanup**: Removed the visual diagram under state and simplified workspace documentation for improved readability.

          ### 📦 Application Features
          - **🧭 Vector Qibla Companion**: Accurate, hardware-sensor calibrated Kaaba compass.
          - **🕌 Dynamic Offline Prayer Calculations**: Latitude/Longitude mathematics with local global city index search.
          - **📖 Offline Text Reader**: Optimized Hisnul Muslim and noble Quran datasets with long-form contrast settings.
          - **📿 Click-to-Count Misbaha**: Haptic-supported Tasbih mechanism recording persistent counts locally.
          
          ---
          *Made is a humble contribution to the Muslim Ummah. May Allah grant Barakah in your spiritual journeys. 🤲*
        files: app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
