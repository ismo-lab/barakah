name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you trigger a build from the Actions tab or the GitHub mobile app,
  # without needing to push a commit first.
  workflow_dispatch:

permissions:
  contents: write

# If you push twice in quick succession, cancel the older run instead of
# letting two builds race to publish a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump this by one whenever you want the offline city catalog rebuilt from
  # fresh GeoNames data. Daily builds reuse the cached catalog keyed on this.
  CITY_CATALOG_REVISION: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The catalog is a pure function of the script plus the GeoNames dump, so
    # rebuild it only when the script changes or CITY_CATALOG_REVISION is bumped.
    - name: Restore offline city catalog
      id: city_catalog
      uses: actions/cache@v4
      with:
        path: |
          app/src/main/assets/cities500.sqlite
          app/src/main/assets/cities500.version
        key: city-catalog-${{ env.CITY_CATALOG_REVISION }}-${{ hashFiles('tools/build_city_database.py') }}

    - name: Build offline city catalog
      if: steps.city_catalog.outputs.cache-hit != 'true'
      run: python tools/build_city_database.py

    - name: Determine Dynamic Version
      id: get_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        MAJOR=$(grep MAJOR app/version.properties | cut -d'=' -f2 | tr -d '\r')
        MINOR=$(grep MINOR app/version.properties | cut -d'=' -f2 | tr -d '\r')
        PATCH=$(grep PATCH app/version.properties | cut -d'=' -f2 | tr -d '\r')
        BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        
        # Check if a release for the base version already exists on GitHub
        if gh release view "v${BASE_VERSION}" >/dev/null 2>&1; then
          DYNAMIC_VERSION="${BASE_VERSION}.${{ github.run_number }}"
        else
          DYNAMIC_VERSION="${BASE_VERSION}"
        fi
        
        echo "VERSION_NAME=${DYNAMIC_VERSION}" >> $GITHUB_ENV
        echo "DYNAMIC_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
        echo "Extracted App Version: ${DYNAMIC_VERSION}"

    - name: Restore Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.BARAKAH_KEYSTORE_BASE64 }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BARAKAH_KEYSTORE_PASSWORD" ] || [ -z "$BARAKAH_KEY_ALIAS" ] || [ -z "$BARAKAH_KEY_PASSWORD" ]; then
          echo "ERROR: Add BARAKAH_KEYSTORE_BASE64, BARAKAH_KEYSTORE_PASSWORD, BARAKAH_KEY_ALIAS, and BARAKAH_KEY_PASSWORD in GitHub Actions secrets."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" > debug.keystore.base64
        base64 --decode debug.keystore.base64 > debug.keystore
        mkdir -p app
        cp debug.keystore app/keystore.jks
        echo "Keystore restored from GitHub Actions secret."
        keytool -list -v -keystore debug.keystore -storepass "$BARAKAH_KEYSTORE_PASSWORD" -alias "$BARAKAH_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

    - name: Build with Gradle
      env:
        DYNAMIC_VERSION: ${{ env.DYNAMIC_VERSION }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      # The release variant, not debug. Debug APKs are flagged debuggable, skip every
      # optimisation, and drag in Compose tooling. Both variants are signed with the
      # same key, so this still installs straight over an older build.
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
        echo "Prepared Barakah-v${{ env.VERSION_NAME }}.apk"

    # A release APK can be produced unsigned or debuggable without failing the build,
    # and either would still install on a phone, so check the artifact before it ships.
    - name: Check the APK is signed and not debuggable
      run: |
        APK=app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "Using build-tools: $BUILD_TOOLS"
        test -x "$BUILD_TOOLS/apksigner"
        test -x "$BUILD_TOOLS/aapt2"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
        if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q application-debuggable; then
          echo "ERROR: the APK is marked debuggable"
          exit 1
        fi
        echo "Signed, and not debuggable."

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Barakah-APK
        path: |
          app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
          app/schemas/**
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name != 'pull_request'
      with:
        tag_name: "v${{ env.VERSION_NAME }}"
        name: "${{ env.VERSION_NAME }}"
        body: |
          ${{ github.event.head_commit.message }}
        files: app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk

  # Reports test failures without ever blocking the APK build above.
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Robolectric 4.16 sandboxes Android SDK 36 only on Java 21+, whereas the APK
    # itself still builds fine on 17. Keep this job on 21 so the Robolectric and
    # screenshot tests can actually run; the build job above stays on 17.
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit and screenshot tests
      env:
        DYNAMIC_VERSION: "ci"
      run: ./gradlew test --stacktrace

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: app/build/reports/tests/
        retention-days: 14

  # Lint finds the class of problem that compiles and runs fine but is still wrong: a permission
  # that is used but never declared, an API above the minimum version, a resource nothing
  # references, a manifest attribute that does nothing. assembleRelease already runs the fatal
  # subset (lintVitalRelease), so this job is here for the rest of it.
  #
  # Reporting only for now: it must not block anything until its findings have been read and
  # either fixed or deliberately turned off, so it is marked continue-on-error and the report is
  # uploaded either way.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Matches the job that builds the APK, so the analysis covers the same variant family.
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The offline city catalog is a plain asset that no Gradle task refers to, so lint does not
    # need it and this job skips the Python steps the build job needs.
    - name: Run lint
      env:
        DYNAMIC_VERSION: "ci"
      run: ./gradlew lintDebug --stacktrace

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.*
        retention-days: 14

