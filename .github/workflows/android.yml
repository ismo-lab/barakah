name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Get Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep VERSION_NAME app/version.properties | cut -d'=' -f2 | tr -d '\r')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "Extracted App Version: $VERSION_NAME"

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
        echo "Renamed app-debug.apk to Barakah-v${{ env.VERSION_NAME }}.apk"

    - name: Delete old releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --json tagName -q ".[].tagName" | while read -r tag; do
          gh release delete "$tag" --cleanup-tag -y || true
        done

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: "v${{ env.VERSION_NAME }}"
        name: "Barakah v${{ env.VERSION_NAME }}"
        body: |
          ## ✨ Barakah v${{ env.VERSION_NAME }} - Release ✨

          **Barakah (بَرَكَة)** is a privacy-respecting, fully Free and Open Source (FOSS) Islamic companion application for Android.

          ### 🕋 Key Highlights
          - **Real-time Qibla Companion**: Interactive sensor-calibrated Kaaba locator with smooth, high-precision vector compass.
          - **Precision Prayer Coordinates**: Dynamic offline latitude/longitude calculations utilizing the official robust **Adhan** algorithm.
          - **Elegant Reader (Quran & Hadith)**: Optically balanced high-contrast layouts with fully customizable font sizes.
          - **Tactile Tasbih**: Interactive, persistent digital misbaha with vibrational ripple-feedback at threshold completions.
          - **Cosmic Dark Theme**: High-contrast eye-safe theme configured for premium battery savings on AMOLED displays.

          ### 🔒 Privacy & Local Integrity
          - **100% Offline Reliable**: Your precise physical location and logs never leave your device.
          - **Authentic and Pure**: Fully ad-free, telemetry-free, and trackers-free.

          ---

          ### 📦 Quick Start Guide
          1. Download the **`Barakah-v${{ env.VERSION_NAME }}.apk`** asset attached below.
          2. Open the downloaded file on your Android device.
          3. If prompted, enable *"Install unknown apps"* or allow installs from your file manager/browser.
          4. Open **Barakah** and may it bring tranquility to your spiritual routines. 🤲
        files: app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
