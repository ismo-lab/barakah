name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine Dynamic Version
      id: get_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        MAJOR=$(grep MAJOR app/version.properties | cut -d'=' -f2 | tr -d '\r')
        MINOR=$(grep MINOR app/version.properties | cut -d'=' -f2 | tr -d '\r')
        PATCH=$(grep PATCH app/version.properties | cut -d'=' -f2 | tr -d '\r')
        BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        
        # Check if a release for the base version already exists on GitHub
        if gh release view "v${BASE_VERSION}" >/dev/null 2>&1; then
          DYNAMIC_VERSION="${BASE_VERSION}.${{ github.run_number }}"
        else
          DYNAMIC_VERSION="${BASE_VERSION}"
        fi
        
        echo "VERSION_NAME=${DYNAMIC_VERSION}" >> $GITHUB_ENV
        echo "DYNAMIC_VERSION=${DYNAMIC_VERSION}" >> $GITHUB_ENV
        echo "Extracted App Version: ${DYNAMIC_VERSION}"

    - name: Restore Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.BARAKAH_KEYSTORE_BASE64 }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BARAKAH_KEYSTORE_PASSWORD" ] || [ -z "$BARAKAH_KEY_ALIAS" ] || [ -z "$BARAKAH_KEY_PASSWORD" ]; then
          echo "ERROR: Add BARAKAH_KEYSTORE_BASE64, BARAKAH_KEYSTORE_PASSWORD, BARAKAH_KEY_ALIAS, and BARAKAH_KEY_PASSWORD in GitHub Actions secrets."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" > debug.keystore.base64
        base64 --decode debug.keystore.base64 > debug.keystore
        mkdir -p app
        cp debug.keystore app/keystore.jks
        echo "Keystore restored from GitHub Actions secret."
        keytool -list -v -keystore debug.keystore -storepass "$BARAKAH_KEYSTORE_PASSWORD" -alias "$BARAKAH_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

    - name: Build with Gradle
      env:
        DYNAMIC_VERSION: ${{ env.DYNAMIC_VERSION }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
        echo "Renamed app-debug.apk to Barakah-v${{ env.VERSION_NAME }}.apk"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: "v${{ env.VERSION_NAME }}"
        name: "${{ env.VERSION_NAME }}"
        body: |
          ${{ github.event.head_commit.message }}
        files: app/build/outputs/apk/debug/Barakah-v${{ env.VERSION_NAME }}.apk
