name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6  # Updated to fix Node 24 deprecation
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5  # Updated to fix Node 24 deprecation
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # Adding --stacktrace helps you see exactly why your compilation failed
      run: ./gradlew assembleDebug --stacktrace 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
