name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    # Optional: Only add this 'defaults' block if your project is in a subfolder
    defaults:
      run:
        working-directory: ./YourSubfolderName # <-- Change this to your folder name

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # ... rest of your steps remain the same
