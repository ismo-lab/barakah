name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 1. This step generates the missing gradlew wrapper files automatically on the runner
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # 2. Grant execution permissions to the newly generated wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. Build using the wrapper (./gradlew) instead of global gradle
    - name: Build with Gradle Wrapper
      run: ./gradlew assembleDebug --stacktrace 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
