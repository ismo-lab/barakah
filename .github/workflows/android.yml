name: Android CI

on:
  push:
    branches: [ "main" ]
    # A release is a tag, not a push. Pushing to main builds and tests, but only a tag on a
    # commit whose version.properties already carries that version publishes anything.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Lets you trigger a build from the Actions tab or the GitHub mobile app,
  # without needing to push a commit first.
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: Re-record the screenshot references instead of comparing against them
        type: boolean
        default: false

permissions:
  contents: write

# If you push twice in quick succession, cancel the older run instead of
# letting two builds race to publish a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Tests and lint gate the build so a tag cannot publish an APK whose tests failed. They are
    # skipped on a push to main (the merged pull request already ran them on this tree), so a
    # skipped dependency has to be allowed through without letting a failure through.
    needs: [tests, lint]
    if: |
      !cancelled() &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        # v5 does not restore this cache, and the Gradle action leaves it read-only on a pull
        # request, which is where this project runs CI. Move on when one of them fixes that.
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Read version
      run: |
        prop() { grep "^$1=" app/version.properties | cut -d'=' -f2 | tr -d '\r'; }
        MAJOR=$(prop MAJOR); MINOR=$(prop MINOR); PATCH=$(prop PATCH)
        BUILD=$(prop BUILD_NUMBER)
        VERSION_NAME=$(prop VERSION_NAME)
        VERSION_CODE=$(prop VERSION_CODE)
        # The build computes both numbers from MAJOR/MINOR/PATCH/BUILD_NUMBER; the VERSION_* lines
        # exist so the metadata file and the release notes can be written without running Gradle.
        # If they disagree the tag is described by one number and shipped as another, so fail here
        # rather than publish something that cannot be matched to its source.
        EXPECTED_CODE=$((MAJOR * 100000 + MINOR * 10000 + PATCH * 100 + BUILD))
        EXPECTED_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD}"
        if [ "$VERSION_CODE" != "$EXPECTED_CODE" ] || [ "$VERSION_NAME" != "$EXPECTED_NAME" ]; then
          echo "ERROR: version.properties is inconsistent."
          echo "MAJOR/MINOR/PATCH/BUILD_NUMBER imply ${EXPECTED_NAME} (${EXPECTED_CODE}),"
          echo "but VERSION_NAME/VERSION_CODE say ${VERSION_NAME} (${VERSION_CODE})."
          exit 1
        fi
        echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
        echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
        echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

    # The tag has to describe the commit it points at, or the release, the F-Droid entry and the
    # APK all disagree about what was shipped.
    - name: Check the tag matches version.properties
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        EXPECTED="v${VERSION_NAME}"
        if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
          echo "ERROR: tag ${GITHUB_REF_NAME} does not match version.properties (${EXPECTED})."
          echo "Bump BUILD_NUMBER/VERSION_CODE/VERSION_NAME, commit, then tag that commit."
          exit 1
        fi
        echo "Tag and version.properties agree on ${EXPECTED}."

    - name: Restore Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.BARAKAH_KEYSTORE_BASE64 }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BARAKAH_KEYSTORE_PASSWORD" ] || [ -z "$BARAKAH_KEY_ALIAS" ] || [ -z "$BARAKAH_KEY_PASSWORD" ]; then
          echo "ERROR: Add BARAKAH_KEYSTORE_BASE64, BARAKAH_KEYSTORE_PASSWORD, BARAKAH_KEY_ALIAS, and BARAKAH_KEY_PASSWORD in GitHub Actions secrets."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" > debug.keystore.base64
        base64 --decode debug.keystore.base64 > debug.keystore
        mkdir -p app
        cp debug.keystore app/keystore.jks
        echo "Keystore restored from GitHub Actions secret."
        keytool -list -v -keystore debug.keystore -storepass "$BARAKAH_KEYSTORE_PASSWORD" -alias "$BARAKAH_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

    - name: Build with Gradle
      env:
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      # The release variant, not debug. Debug APKs are flagged debuggable, skip every
      # optimisation, and drag in Compose tooling. Both variants are signed with the
      # same key, so this still installs straight over an older build.
      #
      # No version input here on purpose: the number comes from version.properties, so the
      # APK built from a tag carries the same versionCode that tag claims, and F-Droid gets
      # an identical one when it rebuilds the same commit.
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
        echo "Prepared Barakah-v${{ env.VERSION_NAME }}.apk"

    # A release APK can be produced unsigned or debuggable without failing the build,
    # and either would still install on a phone, so check the artifact before it ships.
    - name: Check the APK is signed and not debuggable
      run: |
        APK=app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "Using build-tools: $BUILD_TOOLS"
        test -x "$BUILD_TOOLS/apksigner"
        test -x "$BUILD_TOOLS/aapt2"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
        if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q application-debuggable; then
          echo "ERROR: the APK is marked debuggable"
          exit 1
        fi
        echo "Signed, and not debuggable."

    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: Barakah-APK
        path: |
          app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk
          app/schemas/**
        retention-days: 30

    - name: Publish release
      uses: softprops/action-gh-release@v2
      # Only a tag publishes. Pushing to main, opening a pull request or dispatching the workflow
      # by hand still builds and uploads the APK as an artifact, but must not create a release.
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ env.VERSION_NAME }}
        body: |
          Barakah ${{ env.VERSION_NAME }} (versionCode ${{ env.VERSION_CODE }}), built from
          ${{ github.sha }}.

          Signed with the project release key. F-Droid signs its own build of the same tag with a
          different key, so moving between the two needs an uninstall either way.
        files: app/build/outputs/apk/release/Barakah-v${{ env.VERSION_NAME }}.apk

  # Runs the unit and screenshot tests, and blocks the merge: the APK still compiling is not
  # evidence that the app still works.
  #
  # The runner is pinned rather than following ubuntu-latest. The screenshot tests compare against
  # reference images recorded on a specific image, and ubuntu-latest is due to move from 24.04 to
  # 26, which would change what gets rendered.
  tests:
    # A push to main is a merge of a pull request that already ran this job against exactly this
    # tree, so running it again there only delays the release. Pull requests and manual runs still
    # run it, which is where it can still tell us something.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Robolectric 4.16 sandboxes Android SDK 36 only on Java 21+, whereas the APK
    # itself still builds fine on 17. Keep this job on 21 so the Robolectric and
    # screenshot tests can actually run; the build job above stays on 17.
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit and screenshot tests
      run: ./gradlew test --stacktrace -Proborazzi.test.record=${{ github.event.inputs.record_screenshots == 'true' }}

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-report
        path: app/build/reports/tests/
        retention-days: 14

    # The reference images are committed, so this folder is normally empty. It is where a
    # recording run leaves the ones it just made, for downloading and committing.
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: app/src/test/screenshots/
        if-no-files-found: ignore
        retention-days: 14

  # Lint finds the class of problem that compiles and runs fine but is still wrong: a permission
  # that is used but never declared, an API above the minimum version, a resource nothing
  # references, a manifest attribute that does nothing. assembleRelease already runs the fatal
  # subset (lintVitalRelease), so this job is here for the rest of it.
  #
  # Lint findings were read before this job was allowed to fail anything: what was real is fixed
  # and what is deliberate is annotated where it applies, so the report is expected to be empty
  # and anything new in it is worth a look. Errors fail the build; warnings are only reported.
  lint:
    # Skipped on a push to main for the same reason as the tests job: the pull request that was
    # merged ran it on this tree already. assembleRelease still runs lintVitalRelease in the build
    # job, so a fatal finding cannot reach a release.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Matches the job that builds the APK, so the analysis covers the same variant family.
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        # v5 does not restore this cache, and the Gradle action leaves it read-only on a pull
        # request, which is where this project runs CI. Move on when one of them fixes that.
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lintDebug --stacktrace

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.*
        retention-days: 14

