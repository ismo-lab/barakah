name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    # We keep this so the runner knows which Java version to use to compile
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # REMOVED: The 'chmod +x gradlew' step is gone since we aren't using it.

    - name: Build with Gradle
      # CHANGED: Using global 'gradle' instead of './gradlew'
      run: gradle assembleDebug --stacktrace 

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
