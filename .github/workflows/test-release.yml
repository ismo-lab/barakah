name: Test Release

on:
  push:
    tags:
      - "test-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Determine test version
      run: |
        VERSION_NAME="${GITHUB_REF_NAME#test-v}"
        echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
        echo "DYNAMIC_VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
        echo "Test version: ${VERSION_NAME}"

    - name: Restore Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.BARAKAH_KEYSTORE_BASE64 }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BARAKAH_KEYSTORE_PASSWORD" ] || [ -z "$BARAKAH_KEY_ALIAS" ] || [ -z "$BARAKAH_KEY_PASSWORD" ]; then
          echo "ERROR: Add BARAKAH_KEYSTORE_BASE64, BARAKAH_KEYSTORE_PASSWORD, BARAKAH_KEY_ALIAS, and BARAKAH_KEY_PASSWORD in GitHub Actions secrets."
          exit 1
        fi
        printf '%s' "$KEYSTORE_BASE64" > debug.keystore.base64
        base64 --decode debug.keystore.base64 > debug.keystore
        mkdir -p app
        cp debug.keystore app/keystore.jks
        echo "Keystore restored from GitHub Actions secret."
        keytool -list -v -keystore debug.keystore -storepass "$BARAKAH_KEYSTORE_PASSWORD" -alias "$BARAKAH_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

    - name: Build staging APK
      env:
        DYNAMIC_VERSION: ${{ env.DYNAMIC_VERSION }}
        ORG_GRADLE_PROJECT_ciRunNumber: ${{ github.run_number }}
        BARAKAH_KEYSTORE_PASSWORD: ${{ secrets.BARAKAH_KEYSTORE_PASSWORD }}
        BARAKAH_KEY_ALIAS: ${{ secrets.BARAKAH_KEY_ALIAS }}
        BARAKAH_KEY_PASSWORD: ${{ secrets.BARAKAH_KEY_PASSWORD }}
      run: ./gradlew assembleStaging --stacktrace

    - name: Rename compiled APK
      run: |
        cp app/build/outputs/apk/staging/app-staging.apk app/build/outputs/apk/staging/Barakah-test-v${{ env.VERSION_NAME }}.apk
        echo "Prepared Barakah-test-v${{ env.VERSION_NAME }}.apk"

    - name: Check the APK is signed and not debuggable
      run: |
        APK=app/build/outputs/apk/staging/Barakah-test-v${{ env.VERSION_NAME }}.apk
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "Using build-tools: $BUILD_TOOLS"
        test -x "$BUILD_TOOLS/apksigner"
        test -x "$BUILD_TOOLS/aapt2"
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
        if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q application-debuggable; then
          echo "ERROR: the APK is marked debuggable"
          exit 1
        fi
        echo "Signed, and not debuggable."

    - name: Upload test artifact
      uses: actions/upload-artifact@v5
      with:
        name: Barakah-test-v${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/staging/Barakah-test-v${{ env.VERSION_NAME }}.apk
        retention-days: 30

    - name: Create test pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Test ${{ env.VERSION_NAME }}"
        prerelease: true
        body: |
          Test build for Barakah ${{ env.VERSION_NAME }}.

          - Installs beside production as `dev.barakah.app.test`
          - Signed with the production key
          - Not debuggable
          - Not published to F-Droid
        files: app/build/outputs/apk/staging/Barakah-test-v${{ env.VERSION_NAME }}.apk
