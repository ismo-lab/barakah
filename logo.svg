<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#125c34" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#0b381f" stop-opacity="1.0" />
    </linearGradient>
    
    <!-- Subtle Inner Glow for Crescent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle / App Icon Base -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Centered Crescent Moon -->
  <g transform="translate(132, 128) scale(11.5)" filter="url(#glow)">
    <path d="M21,12.79 A9,9 0 1,1 11.21,3 A7,7 0 0,0 21,12.79 z" fill="#FFFFFF" />
  </g>
</svg>
